<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>litfetch</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>litfetch</h1>
    <p>Search Anna's Archive, then download a file or queue it for checking.</p>
  </header>

  <form id="search">
    <input id="query" type="search" placeholder="Title, author, ISBN, DOI or md5" required autocomplete="off">
    <select id="limit" aria-label="Number of results">
      <option>10</option><option selected>20</option><option>50</option>
    </select>
    <button type="submit">Search</button>
    <button type="button" id="settings-toggle">Settings</button>
  </form>

  <section id="settings" hidden>
    <label>Anna's Archive key
      <input id="key" type="password" autocomplete="off" placeholder="from your account page">
    </label>
    <label>Mirror (domain ending, empty for the server's list)
      <input id="tld" type="text" autocomplete="off" placeholder="e.g. gl">
    </label>
    <label>Queue token (LITFETCH_UI_TOKEN of this server)
      <input id="token" type="password" autocomplete="off">
    </label>
    <p class="hint">Stored in this browser only. The key goes to this server with each request
      and from there only to the Anna's Archive mirrors the server allows.</p>
    <button type="button" id="save">Save</button>
  </section>

  <p id="status" role="status"></p>
  <ul id="results"></ul>
</body>
</html>
